<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Songs</title>
    <link rel="stylesheet" href="index.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Monoton&display=swap"
      rel="stylesheet"
    />
  </head>
  <body data-theme="default">
    <h1 id="headline">S<span class="blinking">o</span>ngs</h1>

    <div class="machine">
      <div class="wrapper">
        <div class="wheel">
          <div id="item-list" class="item-list"></div>
        </div>
      </div>
    </div>

    <div class="button-row">
      <button class="button pick" id="pick-button"><span>Spin</span></button>
      <div>
        <button class="button reset" id="reset-button">
          <span>Reset</span>
        </button>
        <button class="button edit" id="edit-button">
          <span>Edit</span>
        </button>
      </div>
    </div>

    <details id="history" class="history">
      <summary>History</summary>
      <ol id="history-entries-wrapper" class="history-entries-wrapper"></ol>
    </details>

    <dialog id="editor-dialog" class="editor-dialog">
      <div id="editor-headline" class="editor-headline"></div>

      <div id="editor-list" class="editor-list"></div>

      <div class="editor-add">
        <input
          type="text"
          class="editor-new-item"
          id="editor-new-item"
          placeholder="New category"
        />

        <button class="editor-button editor-add-button" id="editor-add-button">
          Add
        </button>
      </div>

      <div class="editor-actions">
        <div
          class="theme-switcher"
          role="radiogroup"
          aria-label="Theme selector"
        >
          <label class="theme-option">
            <input type="radio" name="theme" value="carnival" />
            <span class="theme-preview carnival">Carnival</span>
          </label>

          <label class="theme-option">
            <input type="radio" name="theme" value="diner" />
            <span class="theme-preview diner">Diner</span>
          </label>
        </div>
        <button class="editor-button editor-cancel-button" id="editor-cancel">
          Cancel
        </button>

        <button class="editor-button editor-save-button" id="editor-save">
          Save
        </button>
      </div>
    </dialog>

    <script src="script.js"></script>
  </body>
</html>
