<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Songs</title>
    <link rel="stylesheet" href="index.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Monoton&display=swap"
      rel="stylesheet"
    />
  </head>
  <body data-theme="default">
    <h1 id="headline">S<span class="blinking">o</span>ngs</h1>
    <aside>
      <div class="theme-switcher" role="radiogroup" aria-label="Theme selector">
        <label class="theme-option">
          <input type="radio" name="theme" value="carnival" />
          <span class="theme-preview carnival">🎰</span>
        </label>

        <label class="theme-option">
          <input type="radio" name="theme" value="diner" />
          <span class="theme-preview diner">🍦</span>
        </label>
      </div>
    </aside>

    <div class="machine">
      <div class="wrapper">
        <div class="wheel">
          <div id="item-list" class="item-list"></div>
        </div>
      </div>
    </div>

    <div class="button-row">
      <button class="button pick" id="pick-button"><span>Spin</span></button>
      <button class="button reset" id="reset-button">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          height="24px"
          viewBox="0 -960 960 960"
          width="24px"
          fill="#e3e3e3"
        >
          <path
            d="M440-122q-121-15-200.5-105.5T160-440q0-66 26-126.5T260-672l57 57q-38 34-57.5 79T240-440q0 88 56 155.5T440-202v80Zm80 0v-80q87-16 143.5-83T720-440q0-100-70-170t-170-70h-3l44 44-56 56-140-140 140-140 56 56-44 44h3q134 0 227 93t93 227q0 121-79.5 211.5T520-122Z"
          />
        </svg>
      </button>
      <button class="button edit" id="edit-button">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          height="24px"
          viewBox="0 -960 960 960"
          width="24px"
          fill="#e3e3e3"
        >
          <path
            d="M200-200h57l391-391-57-57-391 391v57Zm-80 80v-170l528-527q12-11 26.5-17t30.5-6q16 0 31 6t26 18l55 56q12 11 17.5 26t5.5 30q0 16-5.5 30.5T817-647L290-120H120Zm640-584-56-56 56 56Zm-141 85-28-29 57 57-29-28Z"
          />
        </svg>
      </button>
    </div>

    <dialog id="editor-dialog" class="editor-dialog">
      <div id="editor-headline" class="editor-headline"></div>

      <div id="editor-list" class="editor-list"></div>

      <div class="editor-add">
        <input
          type="text"
          class="editor-new-item"
          id="editor-new-item"
          placeholder="New category"
        />

        <button class="editor-button editor-add-button" id="editor-add-button">
          Add
        </button>
      </div>

      <div class="editor-actions">
        <button class="editor-button editor-cancel-button" id="editor-cancel">
          Cancel
        </button>

        <button class="editor-button editor-save-button" id="editor-save">
          Save
        </button>
      </div>
    </dialog>

    <script src="script.js"></script>
  </body>
</html>
