<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Songs</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <h1>Songs</h1>
    <div class="wheel" id="item-list"></div>

    <div class="button-row">
      <button class="pick-button" id="pick-button">Pick a category</button>
      <button class="reset-button" id="reset-button">Reset list</button>
    </div>

    <span
      class="picked-item"
      id="picked"
      role="status"
      aria-live="polite"
    ></span>

    <script src="script.js"></script>
  </body>
</html>
